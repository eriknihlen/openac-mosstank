# MossTank for openAC-rust: the plugin converted from the C# in ../src to
# Rust, built for wasm32-unknown-unknown and tested natively.
#
# The pure crates (formats, expressions, game data) have no host calls and
# are tested on their own; the plugin crate links the openAC SDK.
[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.6.0-dev"
edition = "2024"
rust-version = "1.95"
license = "MIT"
publish = false

[workspace.dependencies]
mosstank-formats = { path = "crates/mosstank-formats" }
mosstank-expr = { path = "crates/mosstank-expr" }
mosstank-data = { path = "crates/mosstank-data" }
mosstank-dotnet = { path = "crates/mosstank-dotnet" }
mosstank-settings = { path = "crates/mosstank-settings" }
mosstank-stores = { path = "crates/mosstank-stores" }
mosstank-automation = { path = "crates/mosstank-automation" }
mosstank-buffs = { path = "crates/mosstank-buffs" }
mosstank-meta = { path = "crates/mosstank-meta" }
mosstank-combat = { path = "crates/mosstank-combat" }
mosstank-loot = { path = "crates/mosstank-loot" }

# The openAC plugin SDK (MIT), from the openAC-rust repository by git
# (owner decision 2026-10-13). `openac-plugin-compat` is its .NET
# compatibility kit: number formats, the seeded Random, text decoding, JSON
# writers, regex.
openac-plugin = { git = "ssh://git@github.com/eriknihlen/openac-rust.git", branch = "main" }
openac-plugin-compat = { git = "ssh://git@github.com/eriknihlen/openac-rust.git", branch = "main" }
# The plugin ABI types (world positions and the like) without the SDK's host side.
ac-plugin-abi = { git = "ssh://git@github.com/eriknihlen/openac-rust.git", branch = "main" }

thiserror = "2.0"
# SHA-256 for the recovery copies' and old profiles' names and the global
# variables' keys (pure Rust).
sha2 = "0.11"
# The meta views' XML (pure Rust; the SDK's UI kit already uses it).
roxmltree = { version = "0.21.1", default-features = false, features = ["std"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
panic = "abort"
opt-level = "s"
lto = true
