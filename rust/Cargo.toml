# MossTank for openAC-rust: the plugin converted from the C# in ../src to
# Rust, built for wasm32-unknown-unknown and tested natively.
#
# The pure crates (formats, expressions, game data) have no host calls and
# are tested on their own; the plugin crate links the openAC SDK.
[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.6.3"
edition = "2024"
rust-version = "1.95"
license = "MIT"
publish = false

[workspace.dependencies]
mosstank-formats = { path = "crates/mosstank-formats" }
mosstank-expr = { path = "crates/mosstank-expr" }
mosstank-data = { path = "crates/mosstank-data" }
mosstank-dotnet = { path = "crates/mosstank-dotnet" }
mosstank-settings = { path = "crates/mosstank-settings" }
mosstank-stores = { path = "crates/mosstank-stores" }
mosstank-automation = { path = "crates/mosstank-automation" }
mosstank-buffs = { path = "crates/mosstank-buffs" }
mosstank-meta = { path = "crates/mosstank-meta" }
mosstank-nav = { path = "crates/mosstank-nav" }
mosstank-vendor = { path = "crates/mosstank-vendor" }
mosstank-combat = { path = "crates/mosstank-combat" }
mosstank-loot = { path = "crates/mosstank-loot" }
mosstank-ub = { path = "crates/mosstank-ub" }
mosstank-session = { path = "crates/mosstank-session" }
mosstank = { path = "crates/mosstank" }

# The openAC plugin SDK (MIT), from the public openac-rust repository by git,
# pinned to a commit. `openac-plugin-compat` is its .NET
# compatibility kit: number formats, the seeded Random, text decoding, JSON
# writers, regex.
openac-plugin = { git = "https://github.com/eriknihlen/openac-rust", rev = "ca8c98c6bcdcf264c4716a8614b83c14fab668cd" }
openac-plugin-compat = { git = "https://github.com/eriknihlen/openac-rust", rev = "ca8c98c6bcdcf264c4716a8614b83c14fab668cd" }
# The plugin ABI types (world positions and the like) without the SDK's host side.
ac-plugin-abi = { git = "https://github.com/eriknihlen/openac-rust", rev = "ca8c98c6bcdcf264c4716a8614b83c14fab668cd" }

thiserror = "2.0"
# SHA-256 for the recovery copies' and old profiles' names and the global
# variables' keys (pure Rust).
sha2 = "0.11"
# The meta views' XML (pure Rust; the SDK's UI kit already uses it).
roxmltree = { version = "0.21.1", default-features = false, features = ["std"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# The fuel measurement (crates/mosstank-fuel) compiles the built plugin with
# the host's engine, wasmtime and its Cranelift compiler: the dependencies are
# optimised in dev builds, or compiling the 6 MB module takes minutes.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
panic = "abort"
opt-level = "s"
lto = true
