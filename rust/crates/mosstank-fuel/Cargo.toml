[package]
name = "mosstank-fuel"
description = "Measures the fuel (WebAssembly instructions) each call of the built mosstank.wasm uses, the way the openAC plugin host meters it, against a fake client."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ac-plugin-abi.workspace = true

# Native only: the workspace's WebAssembly build has no use for the runner.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The engine the openAC plugin host runs plugins on (openac-rust ef7b128a,
# `ac_plugin::PluginEngine`): wasmtime with its Cranelift compiler, the
# host's own version and features (openac-rust Cargo.toml), so an
# instruction costs the same fuel here as there. The host's engine and
# instance are private to `ac-plugin`; `src/lib.rs` mirrors their settings.
wasmtime = { version = "=48.0.5", default-features = false, features = ["runtime", "cranelift", "std", "async", "parallel-compilation", "reexport-wasmparser"] }

[dev-dependencies]
# The plugin's own test client (crates/mosstank/tests/common), which the
# measurement drives the built module against.
mosstank.workspace = true
mosstank-stores.workspace = true
mosstank-formats.workspace = true
mosstank-data.workspace = true
openac-plugin.workspace = true

[lints]
workspace = true
