name: CI

# The Rust (WebAssembly) plugin's full check, the same script a developer
# runs before every commit (rust/scripts/check.sh, check.ps1 on Windows):
# formatting, clippy, the tests, the WebAssembly build, the module's imports
# and the per-call fuel budgets. Both branch names are listed because
# rust-port becomes main.
on:
  push:
    branches: [main, rust-port]
  pull_request:
    branches: [main, rust-port]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      # The toolchain, its components (rustfmt, clippy) and the
      # wasm32-unknown-unknown target come from rust/rust-toolchain.toml.
      - name: Install the pinned Rust toolchain
        working-directory: rust
        shell: bash
        run: |
          rustup toolchain install
          rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target

      # The fuel budgets measure against openac-gamedata's gameinfodb.ugd
      # when a checkout of it sits beside this one; without it (as here) they
      # measure a generated database with the same tables and row counts.
      - name: Check (Linux)
        if: runner.os != 'Windows'
        run: sh rust/scripts/check.sh

      - name: Check (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./rust/scripts/check.ps1

      - name: Kill-statistics collector tests
        if: runner.os != 'Windows'
        run: python3 -m unittest discover -s tools -p 'test_*.py' -v
